
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Job<span>Tracker</span></a>
    <span class="subtitle">Твой поиск работы под контролем</span>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <p class="eyebrow">МОЯ КАРЬЕРА</p>
        <h1>Вакансии и заметки</h1>
        <p class="muted">Сохраняй интересные вакансии и следи за откликами.</p>
      </div>
      <button id="add-button" class="primary-button" type="button">
        + Добавить вакансию
      </button>
    </section>

    <section class="stats">
      <article class="stat-card">
        <span>Всего вакансий</span>
        <strong id="total-count">0</strong>
      </article>
      <article class="stat-card">
        <span>Отклики</span>
        <strong id="applied-count">0</strong>
      </article>
      <article class="stat-card">
        <span>Интервью</span>
        <strong id="interview-count">0</strong>
      </article>
    </section>

    <section class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Поиск по компании или должности..."
      >
      <select id="status-filter" aria-label="Фильтр по статусу">
        <option value="all">Все статусы</option>
        <option value="Заинтересован">Заинтересован</option>
        <option value="Подана заявка">Подана заявка</option>
        <option value="Собеседование">Собеседование</option>
        <option value="Отклонена">Отклонена</option>
      </select>
    </section>

    <section id="job-list" class="job-list"></section>

    <form id="job-form" class="form-card hidden">
      <h2 id="form-title">Новая вакансия</h2>

      <label>
        Компания *
        <input
          name="company"
          required
          maxlength="100"
          placeholder="Например, Яндекс"
        >
      </label>

      <label>
        Должность *
        <input
          name="position"
          required
          maxlength="150"
          placeholder="Python Backend-разработчик"
        >
      </label>

      <label>
        Ссылка на вакансию
        <input name="url" type="url" placeholder="https://...">
      </label>

      <label>
        Статус
        <select name="status">
          <option value="Заинтересован">Заинтересован</option>
          <option value="Подана заявка">Подана заявка</option>
          <option value="Собеседование">Собеседование</option>
          <option value="Отклонена">Отклонена</option>
        </select>
      </label>

      <label>
        Заметки
        <textarea
          name="notes"
          rows="4"
          maxlength="5000"
          placeholder="Требования, вопросы, подготовка к собеседованию..."
        ></textarea>
      </label>

      <div class="form-actions">
        <button id="cancel-button" class="secondary-button" type="button">
          Отмена
        </button>
        <button id="save-button" class="primary-button" type="submit">
          Сохранить
        </button>
      </div>
    </form>

    <p id="message" class="message" role="status"></p>
  </main>

  <footer>JobTracker · Учебный проект для изучения backend-разработки</footer>
</body>
</html>
