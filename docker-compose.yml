
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: job-tracker-backend
  env_file:
    - .env
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:18
    container_name: postgres-dev
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: job_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *backend
    container_name: job-tracker-api
    mem_limit: 512m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: job-tracker-redis
    mem_limit: 160m
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: job-tracker-rabbitmq
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jobtracker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Задайте RABBITMQ_PASSWORD в .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    container_name: job-tracker-worker
    mem_limit: 384m
    # -E включает события задач: без них celery-exporter не видит метрики задач
    command: celery -A app.celery_app.celery_app worker --loglevel=info -E --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  history-consumer:
    <<: *backend
    container_name: job-tracker-history-consumer
    mem_limit: 256m
    command: python -m app.kafka.consumers.history
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  insights-consumer:
    <<: *backend
    container_name: job-tracker-insights-consumer
    mem_limit: 256m
    command: python -m app.kafka.consumers.insights
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    container_name: job-tracker-kafka
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Ограничиваем память Kafka, чтобы стек помещался на небольшой VPS
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: job-tracker-prometheus
    mem_limit: 256m
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: job-tracker-grafana
    mem_limit: 256m
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Задайте GRAFANA_PASSWORD в .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: job-tracker-redis-exporter
    mem_limit: 128m
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: job-tracker-postgres-exporter
    mem_limit: 128m
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/job_tracker?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  celery-exporter:
    image: ovalmoney/celery-exporter:latest
    container_name: job-tracker-celery-exporter
    mem_limit: 128m
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    command:
      - "--broker-url=amqp://${RABBITMQ_USER:-jobtracker}:${RABBITMQ_PASSWORD}@rabbitmq:5672//"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # HTTPS-прокси: единственный сервис, доступный из интернета.
  # Запускается только с профилем prod.
  caddy:
    image: caddy:2
    container_name: job-tracker-caddy
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
