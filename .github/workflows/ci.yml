name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-that-is-at-least-32-bytes-long
      REDIS_URL: redis://localhost:6379/0
      REDIS_STATISTICS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy-check:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: job_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Миграции и сверка моделей
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/job_tracker
          SECRET_KEY: ci-test-secret-key-that-is-at-least-32-bytes-long
          REDIS_URL: redis://localhost:6379/0
          REDIS_STATISTICS_URL: redis://localhost:6379/2
        run: |
          alembic upgrade head
          alembic check
      - name: Проверка compose и сборка образа
        run: |
          cp .env.example .env
          docker compose --profile prod config -q
          docker build -f backend/Dockerfile -t job-tracker-backend:ci .
